---
# Ansible playbook to manage apt packages
# Run with: ansible-playbook ~/.config/ansible/setup-packages.yml --ask-become-pass

- name: Setup Development Environment Packages
  hosts: all
  # gather_facts: no
  become: yes

  vars:
    # GitHub releases to install
    # NOTE: when bumping a package, update both `url` and `version` together -
    # `version` is what gets compared against the installed marker file to
    # decide whether to skip the download.
    github_releases:
      - name: lazygit
        url: "https://github.com/jesseduffield/lazygit/releases/download/v0.58.1/lazygit_0.58.1_linux_x86_64.tar.gz"
        version: "0.58.1"
        bin_name: lazygit
        bin_path: "lazygit" # Relative path from install_dir
        install_dir: "/opt/lazygit"
        tar_strip: [] # Don't strip components - files are at root

      - name: neovim
        url: "https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz"
        version: "0.11.5"
        bin_name: nvim
        bin_path: "bin/nvim" # Binary is in bin/ subdirectory
        install_dir: "/opt/nvim"

      - name: yazi
        url: "https://github.com/sxyazi/yazi/releases/download/v26.1.4/yazi-x86_64-unknown-linux-gnu.zip"
        version: "26.1.4"
        bin_name: yazi
        bin_path: "yazi" # Will be fixed by the shell task
        install_dir: "/opt/yazi"
        extra_bins: # Additional binaries to symlink
          - ya

      - name: copilot-cli
        url: "https://github.com/github/copilot-cli/releases/download/v0.0.390/copilot-linux-x64.tar.gz"
        version: "0.0.390"
        bin_name: copilot
        bin_path: "copilot"
        install_dir: "/opt/copilot-cli"
        tar_strip: [] # Don't strip components for this tarball

      - name: opencode
        url: "https://github.com/anomalyco/opencode/releases/download/v1.18.15/opencode-linux-x64.tar.gz"
        version: "1.18.15"
        bin_name: opencode
        bin_path: "opencode"
        install_dir: "/opt/opencode"
        tar_strip: [] # Binary is at the archive root

      - name: radarr
        url: "https://github.com/Radarr/Radarr/releases/download/v6.4.1.10545/Radarr.develop.6.4.1.10545.linux-core-x64.tar.gz"
        version: "6.4.1.10545"
        bin_name: Radarr
        bin_path: "Radarr"
        install_dir: "/opt/radarr"
        tar_strip: ["--strip-components=1"]

      - name: prowlarr
        url: "https://github.com/Prowlarr/Prowlarr/releases/download/v2.6.1.5509/Prowlarr.develop.2.6.1.5509.linux-core-x64.tar.gz"
        version: "2.6.1.5509"
        bin_name: Prowlarr
        bin_path: "Prowlarr"
        install_dir: "/opt/prowlarr"
        tar_strip: ["--strip-components=1"]

    # Core development tools
    dev_tools:
      - build-essential
      - cmake
      - meson
      - pkg-config
      - autoconf
      - automake
      - libtool

    # Compilers and languages
    compilers:
      # - gcc
      # - g++
      # - clang
      # - clangd
      # - clang-format
      # - clang-tidy
      # - rustc
      # - cargo
      - nodejs

    # Python development
    python_tools:

    # Debugging and testing
    debug_tools:
      - gdb
      - valgrind
      - lcov
      - gcovr
      - cppcheck

    # Version control
    vcs_tools:
      - gh
      - git-lfs

    # Editors and terminal
    terminal_tools:
      - vim
      - tmux
      - fzf
      - tree
      - zoxide
      - w3m
      - ripgrep

    # Networking and security
    network_tools:
      - curl
      - wget
      - net-tools
      - nmap
      - tcpdump
      - tshark
      - openssh-client
      - openssh-server

    # Container and virtualization
    containers:
      # - docker.io

    # System utilities
    system_utils:
      - libsecret-tools
      - unzip
      - zlib1g
      - zlib1g-dev
      # - lsof
      # - lshw
      # - pciutils
      # - rsync
      # - jq
      # - sqlite3
      - zip
      # - xz-utils

    media_apt_packages:
      - qbittorrent-nox

    tailscale_interfaces: >-
      {{ ansible_interfaces | select('search', 'tailscale') | list }}

    default_installations: "{{ ['lazygit', 'neovim', 'yazi', 'copilot-cli', 'opencode'] + (['radarr', 'prowlarr', 'qbittorrent'] if 'media_servers' in group_names else []) }}"

    selected_installations: >-
      {{ (requested_installations.split(',') if requested_installations is defined
          else default_installations) | map('trim') | reject('equalto', '') | list }}

    selected_github_releases: >-
      {{ github_releases | selectattr('name', 'in', selected_installations) | list }}

  tasks:
    # ============================================
    # GitHub Release Installations
    # ============================================

    - name: Stat existing version marker for each github release
      stat:
        path: "{{ item.install_dir }}/.ansible_installed_version"
      loop: "{{ selected_github_releases }}"
      loop_control:
        label: "{{ item.name }}"
      register: version_marker_stat
      tags: [github]

    - name: Read existing version marker content
      slurp:
        src: "{{ item.item.install_dir }}/.ansible_installed_version"
      loop: "{{ version_marker_stat.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stat.exists
      register: version_marker_slurp
      tags: [github]

    - name: Reset list of github releases needing (re)install
      set_fact:
        github_releases_to_install: []
      tags: [github]

    - name: Determine which github releases need installing
      set_fact:
        github_releases_to_install: "{{ github_releases_to_install + [item.item.item] }}"
      loop: "{{ version_marker_slurp.results }}"
      loop_control:
        label: "{{ item.item.item.name }}"
      when: >-
        item.skipped | default(false) or
        (item.content | b64decode | trim) != item.item.item.version
      tags: [github]

    - name: Report github releases already up to date (skipped)
      debug:
        msg: "{{ item.name }} is already at version {{ item.version }} - skipping download"
      loop: "{{ selected_github_releases | rejectattr('name', 'in', github_releases_to_install | map(attribute='name') | list) | list }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [github]

    - name: Create installation directories for GitHub releases
      file:
        path: "{{ item.install_dir }}"
        state: directory
        mode: "0755"
      loop: "{{ github_releases_to_install }}"
      tags: [github]

    - name: Download and extract GitHub releases (tar.gz)
      unarchive:
        src: "{{ item.url }}"
        dest: "{{ item.install_dir }}"
        remote_src: yes
        extra_opts: "{{ item.tar_strip | default(['--strip-components=1']) }}"
      loop: "{{ github_releases_to_install }}"
      when: item.url.endswith('.tar.gz')
      tags: [github]

    - name: Download and extract GitHub releases (zip)
      unarchive:
        src: "{{ item.url }}"
        dest: "{{ item.install_dir }}"
        remote_src: yes
      loop: "{{ github_releases_to_install }}"
      when: item.url.endswith('.zip')
      tags: [github]

    - name: Fix yazi structure (zip files don't strip components)
      shell: |
        cd {{ item.install_dir }}
        if [ -d yazi-x86_64-unknown-linux-gnu ]; then
          # Use rsync to merge directories and overwrite files
          rsync -a yazi-x86_64-unknown-linux-gnu/ .
          rm -rf yazi-x86_64-unknown-linux-gnu
        fi
      loop: "{{ github_releases_to_install }}"
      when: item.url.endswith('.zip')
      tags: [github]
      args:
        executable: /bin/bash

    - name: Create symlinks in /usr/bin for GitHub releases
      file:
        src: "{{ item.install_dir }}/{{ item.bin_path }}"
        dest: "/usr/bin/{{ item.bin_name }}"
        state: link
        force: yes
        follow: no
      loop: "{{ selected_github_releases }}"
      tags: [github]

    - name: Create symlinks for extra binaries (if defined)
      file:
        src: "{{ item.0.install_dir }}/{{ item.1 }}"
        dest: "/usr/bin/{{ item.1 }}"
        state: link
        force: yes
        follow: no
      loop: "{{ selected_github_releases | subelements('extra_bins', skip_missing=True) }}"
      when: item.0.extra_bins is defined
      tags: [github]

    - name: Create media system group
      group:
        name: media
        system: yes
      when: "'radarr' in selected_installations or 'qbittorrent' in selected_installations"
      tags: [media, radarr, qbittorrent]

    - name: Require exactly one Tailscale interface for qBittorrent
      fail:
        msg: >-
          Expected exactly one interface containing 'tailscale' for qBittorrent,
          found {{ tailscale_interfaces | length }}: {{ tailscale_interfaces }}
      when:
        - "'qbittorrent' in selected_installations"
        - tailscale_interfaces | length != 1
      tags: [qbittorrent]

    - name: Create Radarr system group
      group:
        name: radarr
        system: yes
      when: "'radarr' in selected_installations or 'qbittorrent' in selected_installations"
      tags: [radarr]

    - name: Create Radarr system user
      user:
        name: radarr
        group: radarr
        groups:
          - media
        append: yes
        system: yes
        home: /var/lib/radarr
        create_home: yes
        shell: /usr/sbin/nologin
      when: "'radarr' in selected_installations or 'qbittorrent' in selected_installations"
      tags: [radarr]

    - name: Install qBittorrent-nox
      apt:
        name: "{{ media_apt_packages }}"
        state: present
      when: "'qbittorrent' in selected_installations"
      tags: [qbittorrent]

    - name: Create qBittorrent configuration directory
      file:
        path: /var/lib/radarr/.config/qBittorrent
        state: directory
        owner: radarr
        group: radarr
        mode: "0700"
      when: "'qbittorrent' in selected_installations"
      tags: [qbittorrent]

    - name: Configure qBittorrent-nox
      copy:
        dest: /var/lib/radarr/.config/qBittorrent/qBittorrent.conf
        owner: radarr
        group: radarr
        mode: "0600"
        content: |
          [BitTorrent]
          Session\AddTorrent\AddToTopOfQueue=false

          [LegalNotice]
          Accepted=true

          [Preferences]
          Connection\Interface={{ tailscale_interfaces[0] }}
          Connection\InterfaceAddress=0.0.0.0
          WebUI\Address=*
          WebUI\Port=8080
      notify: Restart qBittorrent
      when: "'qbittorrent' in selected_installations"
      tags: [qbittorrent]

    - name: Install qBittorrent systemd service
      copy:
        dest: /etc/systemd/system/qbittorrent.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=qBittorrent-nox Daemon
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=radarr
          Group=media
          Type=simple
          Environment=HOME=/var/lib/radarr
          WorkingDirectory=/var/lib/radarr
          ExecStart=/usr/bin/qbittorrent-nox
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=20

          [Install]
          WantedBy=multi-user.target
      notify: Restart qBittorrent
      when: "'qbittorrent' in selected_installations"
      tags: [qbittorrent]

    - name: Enable and start qBittorrent
      systemd:
        name: qbittorrent
        enabled: yes
        state: started
        daemon_reload: yes
      when: "'qbittorrent' in selected_installations"
      tags: [qbittorrent]

    - name: Record installed version marker
      copy:
        dest: "{{ item.install_dir }}/.ansible_installed_version"
        content: "{{ item.version }}"
      loop: "{{ github_releases_to_install }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [github]

    - name: Enforce GitHub release ownership and permissions
      file:
        path: "{{ item.install_dir }}"
        owner: root
        group: root
        mode: "u=rwX,go=rX"
        recurse: yes
      loop: "{{ selected_github_releases }}"
      tags: [github]

    - name: Ensure Radarr executable permission
      file:
        path: /opt/radarr/Radarr
        owner: root
        group: root
        mode: "0755"
      when: "'radarr' in selected_installations"
      tags: [radarr]

    - name: Create Radarr data directory
      file:
        path: /var/lib/radarr
        state: directory
        owner: radarr
        group: radarr
        mode: "0750"
      when: "'radarr' in selected_installations"
      tags: [radarr]

    - name: Install Radarr systemd service
      copy:
        dest: /etc/systemd/system/radarr.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Radarr Daemon
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=radarr
          Group=radarr
          Type=simple
          ExecStart=/opt/radarr/Radarr -nobrowser -data=/var/lib/radarr
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=20

          [Install]
          WantedBy=multi-user.target
      notify: Restart Radarr
      when: "'radarr' in selected_installations"
      tags: [radarr]

    - name: Enable and start Radarr
      systemd:
        name: radarr
        enabled: yes
        state: started
        daemon_reload: yes
      when: "'radarr' in selected_installations"
      tags: [radarr]

    - name: Create Prowlarr system group
      group:
        name: prowlarr
        system: yes
      when: "'prowlarr' in selected_installations"
      tags: [prowlarr]

    - name: Create Prowlarr system user
      user:
        name: prowlarr
        group: prowlarr
        system: yes
        home: /var/lib/prowlarr
        create_home: yes
        shell: /usr/sbin/nologin
      when: "'prowlarr' in selected_installations"
      tags: [prowlarr]

    - name: Ensure Prowlarr executable permission
      file:
        path: /opt/prowlarr/Prowlarr
        owner: root
        group: root
        mode: "0755"
      when: "'prowlarr' in selected_installations"
      tags: [prowlarr]

    - name: Create Prowlarr data directory
      file:
        path: /var/lib/prowlarr
        state: directory
        owner: prowlarr
        group: prowlarr
        mode: "0750"
      when: "'prowlarr' in selected_installations"
      tags: [prowlarr]

    - name: Install Prowlarr systemd service
      copy:
        dest: /etc/systemd/system/prowlarr.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prowlarr Daemon
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=prowlarr
          Group=prowlarr
          Type=simple
          ExecStart=/opt/prowlarr/Prowlarr -nobrowser -data=/var/lib/prowlarr
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=20

          [Install]
          WantedBy=multi-user.target
      notify: Restart Prowlarr
      when: "'prowlarr' in selected_installations"
      tags: [prowlarr]

    - name: Enable and start Prowlarr
      systemd:
        name: prowlarr
        enabled: yes
        state: started
        daemon_reload: yes
      when: "'prowlarr' in selected_installations"
      tags: [prowlarr]

    # ============================================
    # Verify media services are healthy
    # ============================================

    - name: Gather service facts
      service_facts:
      when: >-
        'radarr' in selected_installations or
        'prowlarr' in selected_installations or
        'qbittorrent' in selected_installations
      tags: [verify, media]

    - name: Assert Radarr service is active and enabled
      assert:
        that:
          - "'radarr.service' in ansible_facts.services"
          - ansible_facts.services['radarr.service'].state == 'running'
          - ansible_facts.services['radarr.service'].status == 'enabled'
        fail_msg: "Radarr service is not running/enabled as expected!"
        success_msg: "Radarr service is active and enabled."
      when: "'radarr' in selected_installations"
      tags: [verify, radarr]

    - name: Assert Prowlarr service is active and enabled
      assert:
        that:
          - "'prowlarr.service' in ansible_facts.services"
          - ansible_facts.services['prowlarr.service'].state == 'running'
          - ansible_facts.services['prowlarr.service'].status == 'enabled'
        fail_msg: "Prowlarr service is not running/enabled as expected!"
        success_msg: "Prowlarr service is active and enabled."
      when: "'prowlarr' in selected_installations"
      tags: [verify, prowlarr]

    - name: Assert qBittorrent service is active and enabled
      assert:
        that:
          - "'qbittorrent.service' in ansible_facts.services"
          - ansible_facts.services['qbittorrent.service'].state == 'running'
          - ansible_facts.services['qbittorrent.service'].status == 'enabled'
        fail_msg: "qBittorrent service is not running/enabled as expected!"
        success_msg: "qBittorrent service is active and enabled."
      when: "'qbittorrent' in selected_installations"
      tags: [verify, qbittorrent]

    - name: Read deployed qBittorrent config
      slurp:
        src: /var/lib/radarr/.config/qBittorrent/qBittorrent.conf
      register: qbt_conf_raw
      when: "'qbittorrent' in selected_installations"
      tags: [verify, qbittorrent]

    - name: Assert qBittorrent is bound to the Tailscale interface
      assert:
        that:
          - (qbt_conf_raw.content | b64decode) is search('Connection\\\\Interface=' + tailscale_interfaces[0] + '\\n')
        fail_msg: >-
          qBittorrent is NOT confirmed to be routing torrent traffic through the
          Tailscale interface ({{ tailscale_interfaces[0] }})! Check
          /var/lib/radarr/.config/qBittorrent/qBittorrent.conf
        success_msg: "qBittorrent torrent traffic is correctly bound to {{ tailscale_interfaces[0] }}."
      when: "'qbittorrent' in selected_installations"
      tags: [verify, qbittorrent]

    - name: Determine this host's Tailscale IP
      set_fact:
        tailscale_ip: "{{ hostvars[inventory_hostname]['ansible_' ~ tailscale_interfaces[0]]['ipv4']['address'] }}"
      when: "'media_servers' in group_names and tailscale_interfaces | length == 1"
      tags: [verify, media]

    - name: Display media service URLs
      debug:
        msg:
          - "Radarr:      http://{{ tailscale_ip }}:7878"
          - "Prowlarr:    http://{{ tailscale_ip }}:9696"
          - "qBittorrent: http://{{ tailscale_ip }}:8080"
      when: "'media_servers' in group_names and tailscale_interfaces | length == 1"
      tags: [verify, media]

    # ============================================
    # APT Package Installations
    # ============================================

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Install core development tools
      apt:
        name: "{{ dev_tools }}"
        state: present

    - name: Install compilers and languages
      apt:
        name: "{{ compilers }}"
        state: present

    - name: Install Python development tools
      apt:
        name: "{{ python_tools }}"
        state: present

    - name: Install debugging and testing tools
      apt:
        name: "{{ debug_tools }}"
        state: present

    - name: Install version control tools
      apt:
        name: "{{ vcs_tools }}"
        state: present

    - name: Install terminal tools
      apt:
        name: "{{ terminal_tools }}"
        state: present

    - name: Install networking tools
      apt:
        name: "{{ network_tools }}"
        state: present

    - name: Install container tools
      apt:
        name: "{{ containers }}"
        state: present

    - name: Install system utilities
      apt:
        name: "{{ system_utils }}"
        state: present

  handlers:
    - name: Restart Radarr
      systemd:
        name: radarr
        state: restarted
        daemon_reload: yes

    - name: Restart Prowlarr
      systemd:
        name: prowlarr
        state: restarted
        daemon_reload: yes

    - name: Restart qBittorrent
      systemd:
        name: qbittorrent
        state: restarted
        daemon_reload: yes
